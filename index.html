<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="MicroFisca — Simulateur pour comprendre le régime micro-fiscal en moins de 5 minutes.">
  <meta name="color-scheme" content="light">
  <meta name="robots" content="noindex, nofollow" />
  <meta name="googlebot" content="noindex">
  <title>MicroFisca - Simulateur Express</title>
  <!-- Favicon standard -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    /* ════════════════════════════════════════════════════════════════
       MicroFisca — feuille de styles
       Couleurs : jaune #facc15 / bordeaux #800000
       Polices : Plus Jakarta Sans (texte) + JetBrains Mono (chiffres)
       ════════════════════════════════════════════════════════════════ */

    :root {
      --primary: #facc15;
      --primary-tint: rgba(250, 204, 21, 0.10);
      --primary-edge: rgba(250, 204, 21, 0.33);
      --accent: #800000;
      --accent-tint: rgba(128, 0, 0, 0.06);
      --accent-edge: rgba(128, 0, 0, 0.33);

      --bg: oklch(97% 0 0);
      --card: oklch(100% 0 0);
      --ink: oklch(20% 0 0);
      --muted: oklch(62% 0 0);
      --border: oklch(92% 0 0);
      --border-strong: oklch(85% 0 0);
      --neutral-tint: oklch(95% 0 0);

      --success: #16a34a;
      --success-content: #15803d;
      --warn: #d97706;
      --warn-content: #92400e;
      --error: #dc2626;
      --error-content: #991b1b;

      --radius-card: 16px;
      --radius-btn-lg: 14px;
      --radius-btn: 12px;
      --radius-input: 10px;
      --radius-pill: 9999px;

      --font-text: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;

      --shadow-xs: 0 1px 2px oklch(0% 0 0 / 0.04);
      --shadow-sm: 0 1px 4px oklch(0% 0 0 / 0.05);
      --shadow-md: 0 2px 12px oklch(0% 0 0 / 0.08);
      --shadow-lg: 0 2px 8px oklch(0% 0 0 / 0.15);

      --ease: cubic-bezier(0.16, 1, 0.3, 1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }
    body {
      font-family: var(--font-text);
      background: var(--bg);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      line-height: 1.5;
    }

    button { font-family: inherit; }
    input, textarea, select { font: inherit; color: inherit; }
    a { color: inherit; }

    /* Spinner controls neutralisés */
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number] { -moz-appearance: textfield; appearance: textfield; }

    /* Focus visible : accessibilité clavier sans bruit visuel à la souris */
    :focus { outline: none; }
    :focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: 2px;
      border-radius: 4px;
    }
    button:focus-visible,
    a:focus-visible {
      outline-offset: 3px;
    }

    /* ─── Layout général ─────────────────────────────────────────── */
    .page {
      min-height: 100vh;
      padding: 40px 16px 80px;
    }
    .container {
      max-width: 640px;
      margin: 0 auto;
    }

    /* ─── En-tête (logo + tagline) ───────────────────────────────── */
    .header {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      margin-bottom: 32px;
      width: fit-content;
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
      text-align: left;
    }
    .header__mark {
      width: 40px; height: 40px;
      flex-shrink: 0;
      margin-top: 2px;
      border-radius: 10px;
      background: var(--primary);
      display: flex; align-items: center; justify-content: center;
      transition: transform 150ms var(--ease);
    }
    .header:hover .header__mark { transform: scale(1.07); }
    .header__mark svg { width: 32px; height: 30px; stroke-width: 1.5; }
    .header__title {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.1;
      color: var(--ink);
    }
    .header__title em {
      color: var(--accent);
      font-style: normal;
    }
    .header__tagline {
      font-size: 13px;
      color: var(--muted);
      margin-top: 3px;
      line-height: 1.5;
    }

    /* ─── Indicateur d'étapes ────────────────────────────────────── */
    .steps {
      display: flex;
      align-items: center;
      margin-bottom: 28px;
    }
    .steps__item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      flex: 0 0 auto;
    }
    .steps__bullet {
      width: 32px; height: 32px;
      border-radius: 50%;
      border: 2px solid var(--border);
      background: var(--card);
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
      display: flex; align-items: center; justify-content: center;
      cursor: default;
      transition: all 200ms var(--ease);
      flex-shrink: 0;
      padding: 0;
    }
    .steps__bullet[data-state="active"] {
      border: none;
      background: var(--ink);
      color: var(--card);
      box-shadow: var(--shadow-lg);
    }
    .steps__bullet[data-state="done"] {
      border: none;
      background: var(--primary);
      color: var(--ink);
      cursor: pointer;
    }
    .steps__bullet[data-state="done"]:hover {
      transform: scale(1.05);
    }
    .steps__label {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.02em;
      text-align: center;
      white-space: nowrap;
      color: var(--muted);
    }
    .steps__label[data-state="active"],
    .steps__label[data-state="done"] {
      color: var(--ink);
    }
    .steps__label[data-state="active"] {
      font-weight: 700;
    }
    .steps__bar {
      flex: 1;
      height: 2px;
      margin: 0 6px 20px;
      background: var(--border);
      transition: background 300ms var(--ease);
      min-width: 16px;
    }
    .steps__bar[data-state="done"] { background: var(--primary); }

    /* ─── Cards & blocs ──────────────────────────────────────────── */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
    }

    /* Ligne de calcul */
    .calc-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 11px 20px;
      gap: 12px;
      border-bottom: 1px solid var(--border);
    }
    .calc-row:last-child { border-bottom: none; }
    .calc-row[data-size="lg"] { padding: 14px 20px; }
    .calc-row[data-tinted] {
      background: rgba(250, 204, 21, 0.10);
    }
    .calc-row[data-highlight] .calc-row__label,
    .calc-row[data-tinted] .calc-row__label {
      color: var(--accent);
      font-weight: 700;
    }
    .calc-row[data-highlight][data-label-ink] .calc-row__label {
      color: var(--ink);
    }
    .calc-row__head {
	  display: flex;
	  flex-direction: row;
	  align-items: center;
	  flex-wrap: wrap;
	  gap: 6px;
	  min-width: 0;
    }
    .calc-row__label {
      font-size: 13px;
      font-weight: 500;
      color: var(--ink);
    }
    .calc-row[data-size="lg"] .calc-row__label { font-size: 14px; }
    .calc-row__badge {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: var(--radius-pill);
      background: var(--primary);
      color: var(--ink);
	  flex-shrink: 0;
    }
    .calc-row__value {
      font-family: var(--font-mono);
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
      color: var(--ink);
    }
    .calc-row[data-size="lg"] .calc-row__value { font-size: 16px; }
    .calc-row__value[data-color="accent"] { color: var(--accent); }
    .calc-row__value[data-color="muted"] { color: var(--muted); }
    .calc-row__value[data-color="error"] { color: var(--error-content); }

    /* Bloc d'information (encart coloré) */
    .info {
      padding: 12px 14px;
      border-radius: 10px;
      display: flex;
      gap: 10px;
      align-items: flex-start;
      border: 1px solid;
      font-size: 13px;
      line-height: 1.65;
      margin-top: 10px;
    }
    .info__icon {
      font-size: 15px;
      line-height: 1;
      flex-shrink: 0;
      margin-top: 1px;
    }
    .info[data-tone="yellow"] {
      background: rgba(250, 204, 21, 0.17);
      border-color: rgba(250, 204, 21, 0.50);
      color: var(--accent);
    }
    .info[data-tone="orange"] {
      background: rgba(217, 119, 6, 0.10);
      border-color: rgba(217, 119, 6, 0.33);
      color: var(--warn-content);
    }
    .info[data-tone="neutral"] {
      background: var(--neutral-tint);
      border-color: var(--border);
      color: var(--muted);
    }
    .info[data-tone="error"] {
      background: rgba(220, 38, 38, 0.06);
      border-color: rgba(220, 38, 38, 0.30);
      color: var(--error-content);
    }
    .info strong { font-weight: 700; }
    .info__link {
      color: var(--accent);
      font-weight: 700;
      text-decoration: underline;
      text-underline-offset: 2px;
      transition: color 150ms;
    }

    /* Section titres pour le verdict */
    .section-head { margin-bottom: 20px; }
    .section-head h2 {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
    }
    .section-head p {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.6;
    }
    .recap-stripe {
      padding: 10px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--neutral-tint);
    }
    .recap-stripe[data-tone="accent"] {
      padding: 7px 20px;
      background: var(--accent-tint);
    }
    .recap-stripe[data-tone="primary"] {
      padding: 7px 20px;
      background: rgba(250, 204, 21, 0.15);
    }
    .recap-stripe__eyebrow {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .recap-stripe[data-tone="accent"] .recap-stripe__eyebrow { color: var(--accent); font-size: 10px; }
    .recap-stripe[data-tone="primary"] .recap-stripe__eyebrow { color: var(--ink); font-size: 10px; }
    .recap-stripe__activity {
      display: flex; align-items: center; gap: 8px;
      font-size: 13px; font-weight: 600; color: var(--ink);
    }
    /* Récap hiérarchique : catégorie parente + sous-option */
    .recap-stripe[data-tone="stack"] {
      align-items: flex-start;
      padding: 12px 20px;
    }
    .recap-stripe__stack {
      display: flex; flex-direction: column; gap: 4px;
      flex: 1;
    }
    .recap-stripe__parent {
      font-size: 13px; font-weight: 700; color: var(--ink);
      line-height: 1.35;
    }
    .recap-stripe__child {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      font-size: 12px; font-weight: 500; color: var(--muted);
      line-height: 1.4;
    }

    /* ─── Inputs numériques ──────────────────────────────────────── */
    .num-input {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .num-input__field {
      width: 120px;
      text-align: right;
      font-family: var(--font-mono);
      font-size: 15px;
      font-weight: 700;
      padding: 7px 11px;
      border-radius: 8px;
      border: 1.5px solid var(--border);
      background: var(--card);
      color: var(--ink);
      transition: border-color 150ms;
    }
    .num-input__field:focus {
      border-color: var(--primary);
      outline: none;
    }
    .num-input__suffix {
      font-size: 13px;
      color: var(--muted);
      font-weight: 500;
    }
    .num-input__minus {
      font-family: var(--font-mono);
      font-size: 14px;
      font-weight: 700;
      color: var(--muted);
    }

    .inline-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 11px 20px;
      gap: 12px;
      border-bottom: 1px solid var(--border);
    }
    .inline-row[data-align="top"] { align-items: flex-start; }
    .inline-row__label {
      font-size: 13px;
      font-weight: 500;
      color: var(--ink);
    }
    .inline-row__sub {
      font-size: 11px;
      color: var(--muted);
      line-height: 1.55;
      margin-top: 4px;
    }
    .inline-row__sub--recap {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.55;
      margin-top: 4px;
    }

    /* ─── Boutons ────────────────────────────────────────────────── */
    .btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--ink);
      color: var(--card);
      border: none;
      border-radius: var(--radius-btn);
      padding: 13px 28px;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.01em;
      cursor: pointer;
      transition: transform 120ms var(--ease), background 150ms;
    }
    .btn-primary:hover:not(:disabled) { transform: scale(1.02); }
    .btn-primary:active:not(:disabled) { transform: scale(0.98); }
    .btn-primary:disabled {
      background: var(--border);
      color: var(--muted);
      cursor: not-allowed;
    }
    .btn-primary:disabled svg { display: none; }

    .btn-cta {
      width: 100%;
      padding: 16px 32px;
      border-radius: var(--radius-btn-lg);
      background: var(--ink);
      color: var(--card);
      border: none;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -0.02em;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: transform 120ms var(--ease);
    }
    .btn-cta:hover { transform: scale(1.01); }
    .btn-cta:active { transform: scale(0.99); }

    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      padding: 4px 0;
      transition: color 150ms;
      text-decoration: underline;
      text-underline-offset: 3px;
    }
    .btn-back:hover { color: var(--ink); }

    .btn-restart {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: none;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 10px 18px;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      transition: all 150ms;
    }
    .btn-restart:hover { border-color: var(--ink); color: var(--ink); }

    .btn-link-inline {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-size: 13px;
      font-weight: 700;
      color: var(--accent);
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
    }
    .btn-link-inline { text-decoration: underline; text-underline-offset: 2px; }
    .info a:hover { color: inherit !important; }
    .btn-link-inline:hover { text-decoration: underline; text-underline-offset: 2px; color: var(--warn-content); }

    .nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 24px;
    }
    .nav--end { justify-content: flex-end; }

    /* ─── Cartes principales (Accordéons BIC/BNC stylisés comme "Regime") ─ */
    .famille-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 24px;
    }
    .famille-acc {
      display: flex;
      flex-direction: column;
      gap: 0;
    }
    
    .regime {
      padding: 18px 20px;
      border-radius: var(--radius-btn-lg);
      text-align: left;
      border: 1px solid var(--border);
      background: var(--card);
      cursor: pointer;
      transition: border-color 150ms, box-shadow 150ms, transform 150ms var(--ease), background 150ms;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: var(--shadow-xs);
    }
    .regime:hover {
      transform: translateY(-1px);
      border-color: var(--border-strong);
      box-shadow: var(--shadow-sm);
    }
    
    /* Structure de l'entête du bouton d'option */
    .regime__head {
      display: flex; align-items: flex-start; gap: 12px; margin-bottom: 0;
    }
    /* Puce de la famille : bouton radio (sélection = pastille pleine) */
    .regime__radio {
      width: 22px; height: 22px;
      border-radius: 50%;
      border: 1.5px solid var(--border);
      background: var(--card);
      flex-shrink: 0;
      position: relative;
      transition: all 150ms;
      margin-top: 1px;
    }
    
    .regime__title-block {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .regime__name {
      font-size: 15px; font-weight: 700; color: var(--ink);
      line-height: 1.35;
      letter-spacing: -0.01em;
    }
    .regime__teaser {
      display: block;
      margin-top: 4px;
      font-size: 12px;
      font-style: italic;
      font-weight: 500;
      color: var(--muted);
      line-height: 1.4;
      letter-spacing: 0;
    }
    
    .regime__tag {
      font-family: var(--font-mono);
      font-size: 10px; font-weight: 700;
      padding: 2px 8px;
      border-radius: var(--radius-pill);
      letter-spacing: 0.08em;
      background: oklch(92% 0 0);
      color: var(--muted);
      transition: all 150ms;
      flex-shrink: 0;
      margin-top: 1px;
    }
    
    .regime__sub-hint {
      margin-left: 34px;
      font-size: 12px;
      font-weight: 500;
      color: var(--muted);
      display: inline-flex; align-items: center; gap: 6px;
    }
    .regime__sub-hint svg { width: 12px; height: 12px; stroke-width: 2.2; transition: transform 200ms var(--ease); }
    
    /* ─── Accordéon ouvert (Fusion avec le corps des options) ─── */
    .famille-acc[data-open="true"] .regime {
      border-color: var(--ink);
      border-bottom-left-radius: 0;
      border-bottom-right-radius: 0;
      border-bottom: 1px dashed var(--border);
      box-shadow: none; /* L'ombre est gérée par le corps encastré en dessous */
      background: var(--card);
    }
    
    .famille-acc[data-open="true"] .regime__radio {
      border-color: var(--ink);
      background: var(--card);
    }
    .famille-acc[data-open="true"] .regime__radio::after {
      content: "";
      position: absolute;
      inset: 4px;
      border-radius: 50%;
      background: var(--ink);
    }
    .famille-acc[data-open="true"] .regime__tag {
      background: var(--primary);
      color: var(--ink);
    }
    .famille-acc[data-open="true"] .regime__sub-hint {
      color: var(--muted);
      font-weight: 600;
    }
    .famille-acc[data-open="true"] .regime__sub-hint svg {
      transform: rotate(90deg);
      color: var(--ink);
    }
    
    /* Conteneur des sous-options (style fusionné avec le bloc parent, fond blanc encastré) */
    .famille-acc__body {
      background: var(--card);
      border: 1px solid var(--ink);
      border-top: none;
      border-bottom-left-radius: var(--radius-btn-lg);
      border-bottom-right-radius: var(--radius-btn-lg);
      padding: 18px 20px 20px;
      box-shadow: var(--shadow-md);
      display: flex;
      flex-direction: column;
      gap: 12px;
      animation: slideDown 220ms var(--ease) both;
    }
    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-4px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .famille-acc__title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0;
    }
    .sub-q__list {
      display: flex; flex-direction: column; gap: 4px;
    }

    /* ─── Style "Sous-Option" appliqué aux activités ─────────────── */
    .sub-opt {
      position: relative;
      padding: 14px 4px;
      border-radius: 0;
      text-align: left;
      border: none;
      background: transparent;
      cursor: pointer;
      transition: background-color 150ms;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .sub-opt + .sub-opt::before {
      content: "";
      position: absolute;
      top: 0;
      left: 36px; right: 0;
      height: 0;
      border-top: 1px solid var(--border);
    }
    /* On masque le séparateur de part et d'autre de l'option sélectionnée */
    .sub-opt[aria-pressed="true"] + .sub-opt::before,
    .sub-opt + .sub-opt[aria-pressed="true"]::before {
      display: none;
    }
    .sub-opt {
      padding-left: 12px;
      border-left: 2px solid transparent;
    }
    .sub-opt:hover {
      background: transparent;
      border-left-color: var(--border-strong);
    }
    .sub-opt[aria-pressed="true"] {
      background: var(--primary-tint);
      border-left-color: var(--primary);
    }
    .sub-opt[aria-pressed="true"]:hover {
      background: var(--primary-tint);
      border-left-color: var(--primary);
    }
    .sub-opt__head { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 0; }
    /* Puce de la sous-option : coche (sélection = check blanc sur fond sombre) */
    .sub-opt__check {
      width: 14px; height: 14px;
      border-radius: 50%;
      border: 1.5px solid var(--border-strong);
      background: var(--card);
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      transition: all 150ms;
      color: transparent;
      margin-top: 3px;
    }
    .sub-opt__check svg { width: 8px; height: 8px; stroke-width: 3.5; }
    .sub-opt:hover .sub-opt__check { border-color: var(--ink); }
    .sub-opt[aria-pressed="true"] .sub-opt__check {
      border: none;
      background: var(--ink);
      color: var(--card);
    }
    .sub-opt__title-block {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .sub-opt__name {
      font-size: 13px; font-weight: 700; color: var(--ink);
      line-height: 1.35;
    }
    .sub-opt__teaser {
      display: block;
      width: 100%;
      margin-top: 3px;
      font-size: 11.5px;
      font-style: italic;
      font-weight: 500;
      color: var(--muted);
      line-height: 1.4;
    }
    .sub-opt__stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
      margin-left: 24px;
      border-top: 1px solid var(--border);
      padding-top: 8px;
    }
    .sub-opt[aria-pressed="true"] .sub-opt__stats { border-top-color: var(--border-strong); }
    .sub-opt__stat {
      display: flex; flex-direction: column; gap: 2px;
    }
    .sub-opt__stat + .sub-opt__stat {
      border-left: 1px solid var(--border);
      padding-left: 12px;
    }
    .sub-opt[aria-pressed="true"] .sub-opt__stat + .sub-opt__stat {
      border-left-color: var(--border-strong);
    }
    .sub-opt__stat-label {
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .sub-opt__stat-value {
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 700;
      color: var(--ink);
    }
    .sub-opt__stat--abat .sub-opt__stat-value { color: var(--accent); }

    /* Exemples */
    .examples {
      margin-top: 0;
      margin-left: 34px;
      padding: 12px 14px;
      background: var(--card);
      border-radius: var(--radius-field, 8px);
      border: 1px dashed var(--border);
      text-align: left;
    }
    .examples--sub {
      margin-top: 10px;
      margin-left: 24px;
      margin-right: 12px;
      padding: 10px 12px;
    }
    .examples__label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 8px;
    }
    .examples-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .examples-list li {
      position: relative;
      padding-left: 16px;
      font-size: 13px;
      line-height: 1.45;
      color: var(--ink);
    }
    .examples-list--sub li { font-size: 12.5px; }
    .examples-list li::before {
      content: "";
      position: absolute;
      left: 4px; top: 0.62em;
      width: 4px; height: 4px;
      border-radius: 50%;
      background: var(--primary);
    }

    /* ─── Verdict / Analyse express ──────────────────── */
    .verdict {
      padding: 0;
      display: flex;
      flex-direction: column;
    }
    /* Bandeau de verdict */
    .verdict__banner {
      padding: 18px 24px;
      display: flex;
      align-items: center;
      gap: 14px;
      border-bottom: 1px solid var(--border);
    }
    .verdict__banner-icon {
      width: 44px; height: 44px;
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .verdict__banner-icon svg { width: 22px; height: 22px; stroke-width: 2.2; }
    .verdict__banner-text { flex: 1; min-width: 0; }
    .verdict__banner-eyebrow {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 2px;
    }
    .verdict__banner-label {
      font-size: 17px;
      font-weight: 800;
      letter-spacing: -0.015em;
      line-height: 1.25;
    }
    .verdict[data-tone="success"] .verdict__banner-icon { background: rgba(22, 163, 74, 0.12); color: var(--success-content); }
    .verdict[data-tone="success"] .verdict__banner-label { color: var(--success-content); }
    .verdict[data-tone="warn"] .verdict__banner-icon { background: rgba(217, 119, 6, 0.12); color: var(--warn-content); }
    .verdict[data-tone="warn"] .verdict__banner-label { color: var(--warn-content); }
    .verdict[data-tone="error"] .verdict__banner-icon { background: rgba(220, 38, 38, 0.10); color: var(--error-content); }
    .verdict[data-tone="error"] .verdict__banner-label { color: var(--error-content); }

    /* Chiffre-héros : écart fiscal */
    .verdict__hero {
      padding: 24px 24px 22px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 0;
    }
    .verdict__hero-label {
      font-size: 16px;
      font-weight: 700;
      color: var(--ink);
      opacity: 0.75;
      letter-spacing: -0.005em;
      margin-bottom: 6px;
    }
    .verdict__hero-value {
      font-family: var(--font-mono);
      font-size: 36px;
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.05;
      margin-bottom: 12px;
    }
    .verdict[data-tone="success"] .verdict__hero-value { color: var(--success-content); }
    .verdict[data-tone="warn"] .verdict__hero-value { color: var(--warn-content); }
    .verdict[data-tone="error"] .verdict__hero-value { color: var(--error-content); }
    .verdict__hero-sub {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.65;
    }

    /* Comparaison empilée */
    .compare {
      padding: 24px 24px 20px;
    }
    .compare__title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 16px;
      text-align: center;
    }
    .chart {
      position: relative;
    }
    .chart__refline {
      position: absolute;
      left: 0; right: 0;
      border-top: 2px dashed var(--border);
      transition: bottom 600ms var(--ease);
    }
    .chart__bars {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 32px;
      position: relative;
      z-index: 1;
    }
    .chart__col {
      flex: 1;
      max-width: 160px;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100%;
      justify-content: flex-end;
    }
    .chart__amount {
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 6px;
      text-align: center;
    }
    .chart__amount--accent { color: var(--accent); }
    .chart__amount--ink { color: var(--ink); }
    .chart__bar {
      width: 100%;
      border-radius: 8px 8px 0 0;
      box-shadow: var(--shadow-md);
      transition: height 600ms var(--ease);
    }
    .chart__bar--accent { background: var(--accent); }
    .chart__bar--primary { background: var(--primary); }
    .chart__caption {
      padding-top: 10px;
      text-align: center;
    }
    .chart__caption-title {
      font-size: 12px; font-weight: 700;
    }
    .chart__caption-title--accent { color: var(--accent); }
    .chart__caption-sub {
      font-size: 11px; color: var(--muted); margin-top: 2px;
    }
    .chart__baseline {
      position: absolute;
      left: 0; right: 0;
      height: 1px;
      background: var(--border);
      z-index: 2;
    }

    /* Jauge charges/seuil */
    .gauge {
      padding: 22px 24px 24px;
    }
    .gauge__head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 12px;
      gap: 12px;
    }
    .gauge__title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .gauge__values {
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 700;
      color: var(--ink);
    }
    .gauge__values .muted { color: var(--muted); font-weight: 500; }
    .gauge__track {
      position: relative;
      height: 12px;
      background: var(--neutral-tint);
      border-radius: 6px;
      overflow: visible;
    }
    .gauge__fill {
      position: absolute;
      top: 0; left: 0; bottom: 0;
      border-radius: 6px;
      transition: width 600ms var(--ease), background 200ms;
    }
    .gauge__fill[data-tone="success"] { background: var(--success); }
    .gauge__fill[data-tone="warn"] { background: var(--warn); }
    .gauge__fill[data-tone="error"] { background: var(--error); }
    .gauge__threshold {
      position: absolute;
      top: -6px; bottom: -6px;
      width: 2px;
      background: var(--ink);
      transition: left 600ms var(--ease);
    }
    .gauge__threshold::before {
      content: "";
      position: absolute;
      top: -4px; left: -3px;
      width: 8px; height: 8px;
      background: var(--ink);
      border-radius: 50%;
    }
    .gauge__legend {
      display: flex;
      justify-content: space-between;
      margin-top: 10px;
      font-size: 11px;
      color: var(--muted);
      gap: 12px;
    }
    .gauge__legend-marker {
      display: inline-flex; align-items: center; gap: 5px;
    }
    .gauge__legend-marker::before {
      content: ""; display: inline-block;
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--ink);
    }
    .gauge__legend-strong { color: var(--ink); font-weight: 700; }

    /* Phrase explicative finale */
    .verdict__explain {
      padding: 18px 24px 22px;
      font-size: 14px;
      color: var(--muted);
      line-height: 1.65;
    }
    .verdict__explain strong { color: var(--ink); font-weight: 700; }

    /* ─── Step 0 / Step 5 ────────────────────────────────────────── */
    .lede h2 {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.2;
      margin-bottom: 20px;
    }
    .lede p, .copy p {
      font-size: 15px;
      line-height: 1.75;
      color: var(--muted);
    }
    .lede p strong, .copy p strong { color: var(--ink); }
    .copy {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 32px;
    }

    /* ─── Page À propos : sections et listes ─────────────────────── */
    .about-section {
      margin-bottom: 32px;
    }
    .about-section h3 {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--ink);
      margin-bottom: 14px;
    }
    .about-section p {
      font-size: 15px;
      line-height: 1.75;
      color: var(--muted);
      margin-bottom: 14px;
    }
    .about-section p:last-child { margin-bottom: 0; }
    .about-section p strong { color: var(--ink); font-weight: 700; }
    .about-list {
      list-style: none;
      padding: 0;
      margin: 0 0 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .about-list li {
      font-size: 15px;
      line-height: 1.75;
      color: var(--muted);
      padding-left: 20px;
      position: relative;
    }
    .about-list li::before {
      content: "";
      position: absolute;
      left: 6px;
      top: 10px;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #000;
    }
    .about-list li strong { color: var(--ink); font-weight: 700; }
    .about-list a { transition: color 150ms; }
    .about-list a:hover { color: var(--ink) !important; }
    /* fin à propos */

    .feedback-card {
      padding: 28px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 12px;
    }
    .feedback-card__icon {
      width: 52px; height: 52px;
      border-radius: 14px;
      background: var(--primary);
      display: flex; align-items: center; justify-content: center;
    }
    .feedback-card__icon svg { stroke-width: 1.5; }
    .feedback-card__title {
      font-size: 18px; font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--ink);
    }
    .feedback-card__desc {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.6;
      max-width: 380px;
    }
    .feedback-card__btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
      padding: 12px 24px;
      border-radius: 12px;
      background: var(--ink);
      color: var(--card);
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      transition: transform 120ms var(--ease);
    }
    .feedback-card__btn:hover { transform: scale(1.02); }

    /* ─── Étape : champ unique CA / Charges (gros input vertical) */
    .big-num {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .big-num__field {
      flex: 1;
      text-align: right;
      font-family: var(--font-mono);
      font-size: 22px;
      font-weight: 700;
      padding: 12px 16px;
      border-radius: var(--radius-input);
      border: 1.5px solid var(--border);
      background: var(--card);
      color: var(--ink);
      transition: border-color 150ms;
    }
    .big-num__field:focus { border-color: var(--primary); outline: none; }
    .big-num__suffix {
      font-size: 16px;
      color: var(--muted);
      font-weight: 600;
      flex-shrink: 0;
    }

    /* ─── Footer ─────────────────────────────────────────────────── */
    .footer {
      margin-top: 48px;
      text-align: center;
      font-size: 13px;
      font-weight: 500;
      color: var(--muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .footer__nav {
      display: flex;
      align-items: center;
    }
    .footer__link {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      color: var(--muted);
      padding: 0;
      text-decoration: underline;
      text-underline-offset: 3px;
      transition: color 150ms;
    }
    .footer__link:hover { color: var(--ink); }
    .footer__author {
      color: var(--muted);
      text-decoration: none;
      transition: color 150ms;
    }
    .footer__author:hover { color: var(--ink); }
    .footer__sep {
      margin: 0 8px;
      color: var(--border-strong);
    }

    /* ─── Animations ─────────────────────────────────────────────── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .step-enter {
      animation: fadeUp 220ms var(--ease) both;
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* ─── Mobile ─────────────────────────────────────────────────── */
    @media (max-width: 480px) {
      .page { padding: 28px 14px 60px; }
      .header__title { font-size: 22px; }
      .lede h2 { font-size: 24px; }
      .chart__bars { gap: 18px; }
      .num-input__field { width: 110px; font-size: 14px; }
      /* Empile les actions de navigation : bouton primaire en haut full-width, retour en dessous */
      .nav {
        flex-direction: column-reverse;
        align-items: stretch;
        gap: 14px;
      }
      .nav .btn-primary,
      .nav .btn-restart {
        width: 100%;
        justify-content: center;
      }
      .nav .btn-back { align-self: center; }
      .nav--end { align-items: stretch; }
    }

  <script>
  /*  ════════════════════════════════════════════════════════════════
      MicroFisca — application standalone (vanilla JS)
      ════════════════════════════════════════════════════════════════ */
  'use strict';

  /* ────────────────────────────────────────────────────────────────
     1. DONNÉES FISCALES — barèmes 2026
     ----------------------------------------------------------------
     Sources officielles utilisées :
       • Régime fiscal de la micro-entreprise (abattements + seuils) :
           Service-Public.fr — vérifié le 21 février 2026
           https://entreprendre.service-public.gouv.fr/vosdroits/F23267
       • Cotisations sociales 2026 :
           Bercy / economie.gouv.fr — publié le 6 mars 2026
           https://www.economie.gouv.fr/entreprises/gerer-sa-micro-entreprise/micro-entreprises-quel-est-le-montant-de-vos-cotisations-sociales
       • Conséquences du dépassement de seuil :
           Service-Public.fr — vérifié le 21 février 2026
           https://entreprendre.service-public.gouv.fr/vosdroits/F32353

     Architecture des régimes :
       • Niveau 1 (présentation, étape 1) : 2 familles d'activité en accordéon,
         BNC et BIC — voir FAMILLES.
       • Niveau 2 (calcul) : chaque famille déplie ses régimes effectifs, seules
         unités utilisées pour les calculs — voir REGIMES.
           BNC : CIPAV / autres prestations
           BIC : prestations de services / commerce-hébergement / meublé classé / meublé non classé
       Les meublés de tourisme (classé, non classé) sont des régimes BIC,
       pas une famille distincte.
     ──────────────────────────────────────────────────────────────── */

  // Régimes effectifs (niveau 2) — utilisés pour les calculs
  const REGIMES = {
    bic_commerce_hebergement: {
      nom: "Activité commerciale et d'hébergement (hors meublés de tourisme)",

      abattement: 0.71,
      cotisations: 0.1230,
      teaser: 'Ex. : e-commerce, restauration, hôtellerie',
      examples: [
        'Vente en magasin ou en ligne (e-commerce)',
        'Restauration sur place ou à emporter, food-truck',

    },
    bic_prestations_services: {

      examples: [
        'Artisans du bâtiment : plomberie, électricité, menuiserie, maçonnerie',

        'Agent commercial, agent immobilier, VTC'
      ]
    },
    bnc_autres_prestations: {

      examples: [
        'Consultant (informatique, marketing, gestion, stratégie)',

        'Coach professionnel, formateur indépendant',
        'Photographe (hors artiste-auteur)'
      ]
    },
    bnc_cipav: {
      nom: 'Professions libérales réglementées relevant de la Cipav',
      nomCourt: 'Professions libérales réglementées Cipav',
      tag: 'BNC',
      abattement: 0.34,
      cotisations: 0.2320,
      teaser: 'Ex. : architecte, psychologue, ostéopathe',
      examples: [
        'Architecte, architecte d’intérieur, géomètre, ingénieur-conseil',
        'Psychologue, psychothérapeute, ostéopathe, ergothérapeute, diététicien',

      ]
    },
    bic_meuble_classe: {
      nom: "Location de meublés de tourisme classé et chambre d'hôtes",

      cotisations: 0.0600,
      teaser: 'Ex. : gîte classé Atout France, chambre d’hôtes',
      examples: [
        'Gîte rural classé Atout France',
        'Meublé de tourisme avec classement étoilé officiel',
        'Chambre d’hôtes (avec ou sans table d’hôtes)'
      ]
    },
    bic_meuble_non_classe: {
      nom: 'Location de meublés de tourisme non classé',
      nomCourt: 'Location de meublés de tourisme non classé',
      tag: 'BIC',
      abattement: 0.30,
      cotisations: 0.0600,
      teaser: 'Ex. : Airbnb sans classement, location saisonnière',
      examples: [
        'Location courte durée Airbnb sans classement officiel',
        'Studio ou appartement loué à la nuitée / semaine, non classé',
        'Location saisonnière sans label ni étoile'
      ]
    }
  };

  // Familles d'activité (niveau 1 de l'étape 1) — regroupent les régimes par catégorie d'imposition
  const FAMILLES = {
    bnc: {
      tag: 'BNC',
      titre: 'Activité intellectuelle, de conseil ou libérale',
      desc: 'Votre catégorie d\'imposition : "Bénéfices Non Commerciaux" (BNC).',
      regimes: ['bnc_cipav', 'bnc_autres_prestations']
    },
    bic: {
      tag: 'BIC',
      titre: 'Activité manuelle, artisanale ou commerciale',
      desc: 'Votre catégorie d\'imposition : "Bénéfices Industriels et Commerciaux" (BIC).',
      regimes: ['bic_prestations_services', 'bic_commerce_hebergement', 'bic_meuble_classe', 'bic_meuble_non_classe']
    }
  };

  // Table inverse régime → famille (récap étape 4 robuste, sans dépendre de state.famille)
  const REGIME_TO_FAMILLE = Object.fromEntries(
    Object.entries(FAMILLES).flatMap(([famKey, fam]) => fam.regimes.map((r) => [r, famKey]))
  );

  // Plafonds CA 2026 (revenus 2026 déclarés en 2027)
  const SEUILS_CA = {
    bic_commerce_hebergement: 203100,
    bic_prestations_services: 83600,
    bnc_autres_prestations: 83600,
    bnc_cipav: 83600,
    bic_meuble_classe: 83600,
    bic_meuble_non_classe: 15000
  };

  const DERNIERE_MAJ = 'mai 2026';

  /* ────────────────────────────────────────────────────────────────
     2. HELPERS
     ──────────────────────────────────────────────────────────────── */

  const fmtEUR = (n) => new Intl.NumberFormat('fr-FR',
    { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 }).format(n);

  const fmtPct = (n) => (n * 100).toLocaleString('fr-FR',
    { maximumFractionDigits: 1 }) + ' %';

  // Format à 2 décimales pour les cotisations (alignement avec les libellés officiels Bercy)
  const fmtPctPrecise = (n) => (n * 100).toLocaleString('fr-FR',
    { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' %';

  const fmtEURplain = (n) => new Intl.NumberFormat('fr-FR',
    { maximumFractionDigits: 0 }).format(n);

  // Validation d'entrée numérique : refuse négatifs, infinis et au-delà de 1 milliard
  const safeNum = (raw) => {
    const v = parseFloat(raw);
    if (!Number.isFinite(v)) return 0;
    return Math.max(0, Math.min(v, 1e9));
  };

  // Branche un champ <input type="number"> sur state[key] avec validation safeNum,
  // resync en cas de clamp, et un callback déclenché après chaque changement.
  function bindNumberInput(input, key, onAfter) {
    input.addEventListener('input', (e) => {
      if (e.target.value === '') {
        state[key] = '';
      } else {
        state[key] = safeNum(e.target.value);
        // Resynchronisation si la saisie a été clampée
        if (String(state[key]) !== e.target.value && !e.target.value.endsWith('.')) {
          e.target.value = state[key];
        }
      }
      onAfter();
    });
  }

  // Création d'élément concis
  function el(tag, attrs, ...children) {
    const node = document.createElement(tag);
    if (attrs) {
      for (const [k, v] of Object.entries(attrs)) {
        if (v == null || v === false) continue;
        if (k === 'class') node.className = v;
        else if (k === 'dataset') Object.assign(node.dataset, v);
        else if (k === 'style' && typeof v === 'object') Object.assign(node.style, v);
        else if (k === 'html') node.innerHTML = v;
        else if (k.startsWith('on') && typeof v === 'function') {
          node.addEventListener(k.slice(2).toLowerCase(), v);
        } else if (typeof v === 'boolean') {
          if (v) node.setAttribute(k, '');
        } else {
          node.setAttribute(k, v);
        }
      }
    }
    for (const c of children.flat(Infinity)) {
      if (c == null || c === false) continue;
      node.appendChild(typeof c === 'string' || typeof c === 'number'
        ? document.createTextNode(c) : c);
    }
    return node;
  }

  // Helper SVG inline (icônes statiques de confiance)
  function svgIcon(markup, size = 16, extraAttrs = '') {
    const wrap = document.createElement('span');
    wrap.style.display = 'inline-flex';
    wrap.innerHTML = markup
      .replace('<svg', `<svg width="${size}" height="${size}" ${extraAttrs}`);
    return wrap.firstElementChild;
  }

  const ICONS = {
    chevronRight: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>',
    chevronLeft:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>',
    check:        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>',
    restart:      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 102.13-9.36L1 10"/></svg>',
    edit:         '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>',
    piggy:        '<svg viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v6c0 1.66 3.58 3 8 3s8-1.34 8-3V6"/><path d="M4 12v6c0 1.66 3.58 3 8 3s8-1.34 8-3v-6"/></svg>',
    // Verdict
    verdict_success: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.5V12a10 10 0 11-5.9-9.1"/><polyline points="22 4 12 14 9 11"/></svg>',
    verdict_warn:    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>',
    verdict_error:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.86L1.82 18a2 2 0 001.7 3h16.96a2 2 0 001.7-3L13.7 3.86a2 2 0 00-3.4 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>'
  };

  /* ────────────────────────────────────────────────────────────────
     3. CALCUL FISCAL (cœur métier)
     ──────────────────────────────────────────────────────────────── */

  function computeAll(regime, ca, chargesReelles) {
    const r = REGIMES[regime];
    const abattement = ca * r.abattement;
    const revenusImposables = ca - abattement;
    const cotisations = ca * r.cotisations;
    const totalCharges = cotisations + chargesReelles;
    const netReel = ca - totalCharges;
    return { abattement, revenusImposables, cotisations, totalCharges, netReel };
  }

  // Seuil d'optimisation microfisca : tant que charges_réelles/CA < (%abattement − %cotisations),
  // le micro-fiscal est avantageux.
  function thresholdPct(regime) {
    const r = REGIMES[regime];
    return ((r.abattement - r.cotisations) * 100).toLocaleString('fr-FR', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
  }

  /* ────────────────────────────────────────────────────────────────
     4. ÉTAT GLOBAL & NAVIGATION
     ──────────────────────────────────────────────────────────────── */

  const state = {
    step: 0,
    prevStep: null,
    famille: null,     // clé de FAMILLES (niveau 1 — catégorie d'imposition BIC/BNC, choisie à l'étape 1)
    regime: null,      // clé de REGIMES (niveau 2 — résolu via la sous-option de l'accordéon)
    ca: '',            // chaîne brute du champ (vide = non saisi)
    charges: ''
  };

  function setState(patch) {
    Object.assign(state, patch);
    render();
  }

  // Ouverture/fermeture d'une famille (niveau 1 — accordéon). Change de famille = on reset le régime.
  function selectFamille(famKey) {
    if (state.famille === famKey) {
      setState({ famille: null, regime: null });
    } else {
      setState({ famille: famKey, regime: null });
    }
  }

  // Sélection d'un régime (niveau 2). On dérive la catégorie du régime pour garder l'état cohérent.
  function selectRegime(regimeKey) {
    setState({ regime: regimeKey });
  }

  const goTo = (s) => setState({ prevStep: state.step, step: s });
  const next = () => setState({ prevStep: state.step, step: Math.min(state.step + 1, 4) });
  const back = () => setState({ prevStep: state.step, step: Math.max(state.step - 1, 1) });
  const home = () => setState({
    step: 0, prevStep: null, famille: null, regime: null, ca: '', charges: ''
  });
  const restart = () => setState({
    step: 1, prevStep: null, famille: null, regime: null, ca: '', charges: ''
  });

  /* ────────────────────────────────────────────────────────────────
     5. COMPOSANTS RÉUTILISABLES
     ──────────────────────────────────────────────────────────────── */

  function Card(children, extraClass = '') {
    return el('div', { class: 'card ' + extraClass }, children);
  }

  function CalcRow({ label, value, badge, valueColor, size, tinted, highlight, labelInk }) {
    return el('div', {
      class: 'calc-row',
      dataset: {
        ...(size ? { size } : {}),
        ...(tinted ? { tinted: '' } : {}),
        ...(highlight ? { highlight: '' } : {}),
        ...(labelInk ? { labelInk: '' } : {})
      }
    },
      el('div', { class: 'calc-row__head' },
        el('span', { class: 'calc-row__label' }, label),
        badge ? el('span', { class: 'calc-row__badge' }, badge) : null
      ),
      el('span', {
        class: 'calc-row__value',
        ...(valueColor ? { dataset: { color: valueColor } } : {})
      }, value)
    );
  }

  function InfoBox({ tone = 'neutral', icon, html, children }) {
    const body = el('div');
    if (html) body.innerHTML = html;
    else if (children) {
      (Array.isArray(children) ? children : [children]).forEach(c => {
        if (c) body.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
      });
    }
    return el('div', { class: 'info', dataset: { tone } },
      icon ? el('span', { class: 'info__icon' }, icon) : null,
      body
    );
  }

  // Alerte de dépassement de seuil micro-entreprise (rendue à l'étape 2 et au verdict)
  function seuilDepasseInfoBox(regime) {
    const seuil = SEUILS_CA[regime];
    return InfoBox({
      tone: 'orange', icon: '⚠️',
      html: `<strong>ATTENTION : seuil micro-entreprise dépassé.</strong> Pour cette activité, le plafond annuel de chiffre d’affaires en 2026 est de <strong>${fmtEUR(seuil)}</strong>.<br>Pour en savoir plus sur les conséquences du dépassement, consultez <a href="https://entreprendre.service-public.gouv.fr/vosdroits/F32353" target="_blank" rel="noopener noreferrer" class="info__link">cette fiche</a>.`
    });
  }

  function PrimaryBtn(label, onClick, { disabled = false } = {}) {
    return el('button', {
      class: 'btn-primary',
      type: 'button',
      disabled: disabled || null,
      onclick: onClick
    }, label, svgIcon(ICONS.chevronRight, 16));
  }

  function BackBtn(onClick) {
    return el('button', {
      class: 'btn-back', type: 'button', onclick: onClick,
      'aria-label': 'Étape précédente'
    },
      svgIcon(ICONS.chevronLeft, 15),
      'Étape précédente'
    );
  }

  /* Indicateur d'étapes (1-4 visibles, "Activité / CA / Net / Bilan") */
  function StepIndicator(current, total = 4) {
    const labels = ['Activité', 'Revenu imposable', 'Bénéfice réel', 'Bilan'];
    const wrap = el('div', { class: 'steps', role: 'progressbar',
      'aria-valuemin': '1', 'aria-valuemax': String(total),
      'aria-valuenow': String(current),
      'aria-label': `Étape ${current} sur ${total} : ${labels[current - 1]}` });
    for (let i = 0; i < total; i++) {
      const step = i + 1;
      const status = step < current ? 'done' : step === current ? 'active' : 'todo';
      const item = el('div', { class: 'steps__item' });
      const btn = el('button', {
        class: 'steps__bullet',
        type: 'button',
        dataset: { state: status },
        'aria-label': status === 'done'
          ? `Revenir à l'étape ${step} : ${labels[i]}`
          : `Étape ${step} : ${labels[i]}`,
        ...(status === 'done' ? { onclick: () => goTo(step) } : {})
      });
      btn.appendChild(status === 'done'
        ? svgIcon(ICONS.check, 14)
        : document.createTextNode(String(step)));
      const lbl = el('span', { class: 'steps__label', dataset: { state: status } }, labels[i]);
      item.appendChild(btn);
      item.appendChild(lbl);
      wrap.appendChild(item);
      if (i < total - 1) {
        wrap.appendChild(el('div', {
          class: 'steps__bar',
          dataset: { state: step < current ? 'done' : 'todo' }
        }));
      }
    }
    return wrap;
  }

  /* ────────────────────────────────────────────────────────────────
     6. ÉTAPES (rendu + interactions)
     ──────────────────────────────────────────────────────────────── */

  /* Step 0 — Accueil ─────────────────────────────────────────────── */
  function renderStep0() {
    return el('div', { class: 'step-enter' },
      el('div', { class: 'lede' },
        el('h2', null, 'Vous envisagez de créer une micro-entreprise ?'),
      ),
      el('div', { class: 'copy' },
        el('p', { html: 'La micro-entreprise est séduisante par sa simplicité. <br>Mais elle peut cacher un piège : sous-estimer les <strong>charges</strong> et l&#39;<strong>impact sur ses impôts</strong>.' }),
        (() => { const box = InfoBox({ tone: 'yellow', html: '<strong>MicroFisca</strong>&nbsp; permet de voir si <strong>vous risquez de payer des impôts sur de l&#39;argent que vous n&#39;avez pas gagné</strong> (dans le régime micro-fiscal classique).' }); box.style.fontSize = '15px'; box.style.lineHeight = '1.75'; return box; })(),
        el('p', { html: 'Cet outil est : <br>✅ &nbsp; 100% <strong>Gratuit</strong><br> ✅ &nbsp; <strong>Rapide</strong> (moins de 5 minutes) <br> ✅ &nbsp; <strong>Confidentiel</strong> (zéro donnée collectée).' })
      ),
      el('button', {
        class: 'btn-cta', type: 'button',
        onclick: () => setState({ step: 1, prevStep: 0 })
      },
        'Faire le test maintenant',
        svgIcon(ICONS.chevronRight, 18)
      )
    );
  }

  /* Step 1 — Choix du régime ─────────────────────────────────────── */
  // Liste d'exemples d'activités, rendue dans le corps d'une sous-option (niveau 2)
  function ExamplesList(examples) {
    const ulClass = 'examples-list examples-list--sub';
    const wrapClass = 'examples examples--sub';
    const ul = el('ul', { class: ulClass });
    examples.forEach((ex) => ul.appendChild(el('li', null, ex)));
    return el('div', { class: wrapClass },
      el('div', { class: 'examples__label' }, 'Exemples d’activités'),
      ul
    );
  }

  // Stats abattement / cotisations d'un régime, affichées dans la sous-option (niveau 2)
  function StatsRow(reg) {
    return el('div', { class: 'sub-opt__stats' },
      el('div', { class: 'sub-opt__stat sub-opt__stat--abat' },
        el('span', { class: 'sub-opt__stat-label' }, 'Abattement'),
        el('span', { class: 'sub-opt__stat-value' }, fmtPct(reg.abattement))
      ),
      el('div', { class: 'sub-opt__stat' },
        el('span', { class: 'sub-opt__stat-label' }, 'Cotisations'),
        el('span', { class: 'sub-opt__stat-value' }, fmtPctPrecise(reg.cotisations))
      )
    );
  }

  // Carte d'une activité (niveau 2) affichée dans le corps de l'accordéon d'une famille
  function SubOptCard(regKey, reg, active) {
    const btn = el('button', {
      class: 'sub-opt', type: 'button', role: 'radio',
      'aria-checked': active ? 'true' : 'false',
      'aria-pressed': active ? 'true' : 'false',
      onclick: () => selectRegime(regKey)
    });

    btn.appendChild(el('div', { class: 'sub-opt__head' },
      el('div', { class: 'sub-opt__check', 'aria-hidden': 'true' },
        svgIcon(ICONS.check, 10)
      ),
      el('div', { class: 'sub-opt__title-block' },
        el('span', { class: 'sub-opt__name' }, reg.nom),
        (!active && reg.teaser) ? el('span', { class: 'sub-opt__teaser' }, reg.teaser) : null
      )
    ));

    if (active) {
      if (Array.isArray(reg.examples) && reg.examples.length) {
        btn.appendChild(ExamplesList(reg.examples));
      }
      btn.appendChild(StatsRow(reg));
    }

    return btn;
  }

  function renderStep1() {
    const root = el('div', { class: 'step-enter' });

    root.appendChild(el('div', { class: 'section-head' },
      el('h2', null, 'Quelle est votre activité ?'),
      el('p', { html: 'Sélectionnez le type d\'activité correspondant à votre entreprise.' })
    ));

    const list = el('div', { class: 'famille-list', role: 'radiogroup',
      'aria-label': 'Choisir une famille d\'activité' });

    Object.entries(FAMILLES).forEach(([famKey, fam]) => {
      const isOpen = state.famille === famKey;
      const accWrap = el('div', { class: 'famille-acc', dataset: { open: isOpen ? 'true' : 'false' } });

      // En-tête de la famille (stylée comme les anciennes cartes « regime »)
      const headerBtn = el('button', {
        class: 'regime', type: 'button',
        'aria-expanded': isOpen ? 'true' : 'false',
        onclick: () => selectFamille(famKey)
      },
        el('div', { class: 'regime__head' },
          el('div', { class: 'regime__radio', 'aria-hidden': 'true' }),
          el('div', { class: 'regime__title-block' },
            el('span', { class: 'regime__name' }, fam.titre),
            (!isOpen && fam.desc) ? el('span', { class: 'regime__teaser' }, fam.desc) : null
          ),
          el('span', { class: 'regime__tag' }, fam.tag)
        ),
        el('div', { class: 'regime__sub-hint' },

        )
      );

      // Corps de l'accordéon : les activités détaillées de la famille
      if (isOpen) {
        const body = el('div', { class: 'famille-acc__body' });
        const subList = el('div', { class: 'sub-q__list', role: 'radiogroup',
          'aria-label': 'Précisez votre activité' });
        fam.regimes.forEach((regKey) => {
          const reg = REGIMES[regKey];
          const active = state.regime === regKey;
          subList.appendChild(SubOptCard(regKey, reg, active));
        });
        body.appendChild(subList);
        accWrap.appendChild(body);
      }

      list.appendChild(accWrap);
    });
    root.appendChild(list);

    root.appendChild(InfoBox({
      tone: 'yellow', icon: '📌',
      html: 'En micro-entreprise, le régime fiscal varie selon la nature de l’activité. Chaque régime applique un abattement forfaitaire différent à votre CA pour calculer votre revenu imposable.'
    }));

    root.appendChild(InfoBox({
      tone: 'orange', icon: '⚠️',
      html: 'Pour les activités de services, le revenu imposable peut varier de plusieurs milliers d’euros selon la catégorie d’imposition (BNC ou BIC).'
    }));

    root.appendChild(el('div', { class: 'nav nav--end' },
      PrimaryBtn('Étape suivante', next, { disabled: !state.regime })
    ));

    return root;
  }

  /* Step 2 — CA + abattement ─────────────────────────────────────── */
  function renderStep2() {
    const root = el('div', { class: 'step-enter' });

    root.appendChild(el('div', { class: 'section-head' },
      el('h2', null, 'Quel est votre chiffre d’affaires annuel ?'),
      el('p', { html: 'Indiquez votre CA annuel (prévisionnel ou réel), pour calculer le <strong>revenu imposable</strong> de votre micro-entreprise.' })
    ));

    // Card avec input + zone calculée dynamique
    const computedArea = el('div');
    const card = Card([
      // Ligne d'input CA
      (() => {
        const input = el('input', {
          class: 'num-input__field',
          type: 'number', min: 0, max: 1e9, step: '100',
          placeholder: '0', inputmode: 'numeric',
          'aria-label': 'Chiffre d’affaires annuel en euros',
          value: state.ca === '' ? '' : String(state.ca)
        });
        bindNumberInput(input, 'ca', () => {
          refreshComputed();
          refreshAlert();
          syncNextDisabled();
        });

        return el('div', { class: 'inline-row' },
          el('span', { class: 'inline-row__label' }, 'Chiffre d’affaires annuel'),
          el('div', { class: 'num-input' },
            input,
            el('span', { class: 'num-input__suffix' }, '€')
          )
        );
      })(),
      computedArea
    ]);
    root.appendChild(card);

    const alertArea = el('div');
    root.appendChild(alertArea);

    // Zone rendue dynamiquement (sans re-render complet) :
    function refreshComputed() {
      computedArea.innerHTML = '';
      const ca = typeof state.ca === 'number' ? state.ca : 0;
      if (ca > 0 && state.regime) {
        const d = computeAll(state.regime, ca, 0);
        computedArea.appendChild(CalcRow({
          label: 'Abattement forfaitaire',
          badge: fmtPct(REGIMES[state.regime].abattement),
          value: '− ' + fmtEUR(d.abattement),
          valueColor: 'muted'
        }));
        computedArea.appendChild(CalcRow({
          label: 'Revenu imposable',
          value: '= ' + fmtEUR(d.revenusImposables),
          valueColor: 'accent',
          highlight: true,
          size: 'lg'
        }));
      }
    }

    function refreshAlert() {
      alertArea.innerHTML = '';
      const ca = typeof state.ca === 'number' ? state.ca : 0;
      if (ca > 0 && state.regime) {
        const d = computeAll(state.regime, ca, 0);
        alertArea.appendChild(InfoBox({
          tone: 'yellow', icon: '📌',
          html: `<strong>Ce que ça signifie :</strong> dans le régime micro-fiscal classique, le montant soumis à l'impôt sur le revenu pour votre activité est de <strong>${fmtEUR(d.revenusImposables)}</strong>.<br>L’<strong>abattement de ${fmtPct(REGIMES[state.regime].abattement)}</strong> dans ce calcul est censé représenter vos <strong>frais professionnels.</strong><br>Vos charges réelles ne sont pas prises en compte pour déterminer le revenu imposable.`
        }));

        // Alerte de dépassement de seuil micro-entreprise (revenus 2026)
        // Règle officielle (Service-Public.fr — F32353) :
        //   • Le CA pris en compte est celui de N-1 et N-2, pas l'année en cours
        //   • La sortie n'intervient qu'après 2 années consécutives de dépassement
        //   • Effet au 1er janvier de l'année qui suit la 2e année consécutive
        const seuil = SEUILS_CA[state.regime];
        if (ca > seuil) {
          alertArea.appendChild(seuilDepasseInfoBox(state.regime));
        } else if (ca < seuil && seuil - ca < seuil * 0.10) {
          // Alerte douce à moins de 10 % du plafond (exclu si CA = seuil exact)
          alertArea.appendChild(InfoBox({
            tone: 'neutral', icon: 'ℹ️',
            html: `Vous approchez du plafond annuel pour cette activité (${fmtEUR(seuil)} en 2026).`
          }));
        }
      }
    }

    refreshComputed();
    refreshAlert();

    // Nav
    const nextBtn = PrimaryBtn('Étape suivante', next, {
      disabled: !(typeof state.ca === 'number' && state.ca > 0)
    });
    function syncNextDisabled() {
      nextBtn.disabled = !(typeof state.ca === 'number' && state.ca > 0);

  // Classification du verdict : libellés et ton selon l'écart (revenu imposable − bénéfice réel)
  function getVerdictMeta(diff) {
    if (diff < 0) {
      return {
        tone: 'success',
        label: 'Régime micro-fiscal avantageux',
        heroLabel: 'Bénéfice réalisé qui est non imposable :',
        heroValue: fmtEUR(Math.abs(diff)),
        heroSub: 'Votre revenu imposable est inférieur à votre bénéfice réel : le régime micro-fiscal est avantageux.'
      };
    }
    if (diff === 0) {
      return {
        tone: 'success',
        label: 'Régime micro-fiscal à l’équilibre',
        heroLabel: 'Bénéfice réalisé qui est non imposable :',
        heroValue: fmtEUR(0),
        heroSub: 'Votre revenu imposable correspond à votre bénéfice réel : le régime micro-fiscal est neutre.'
      };
    }
    if (diff <= 1000) {
      return {
        tone: 'warn',
        label: 'Régime micro-fiscal non optimal',
        heroLabel: 'Revenus imposables au-delà de ce qui est réellement gagné :',
        heroValue: fmtEUR(diff),
        heroSub: 'Une partie de vos revenus imposables ne correspond pas à de l’argent réellement gagné. L’impact potentiel sur votre impôt sur le revenu reste relativement faible.'
      };
    }
    if (diff <= 5000) {
      return {
        tone: 'warn',
        label: 'Régime micro-fiscal non optimal',
        heroLabel: 'Revenus imposables au-delà de ce qui est réellement gagné :',
        heroValue: fmtEUR(diff),
        heroSub: 'Une partie de vos revenus imposables ne correspond pas à de l’argent réellement gagné. L’impact potentiel sur votre impôt sur le revenu reste relativement modéré. Si vos charges sont élevées, le régime réel d’imposition pourrait être plus intéressant.'
      };
    }
    return {
      tone: 'error',
      label: 'Régime micro-fiscal à reconsidérer',
      heroLabel: 'Revenus imposables au-delà de ce qui est réellement gagné :',
      heroValue: fmtEUR(diff),
      heroSub: 'Une part significative de vos revenus imposables ne correspond pas à de l’argent réellement gagné. Le passage au régime réel d’imposition serait à étudier (surtout si votre CA et vos charges sont élevés).'
    };
  }

  const VERDICT_ICON = { success: 'verdict_success', warn: 'verdict_warn', error: 'verdict_error' };

  // Observer singleton pour le chart du verdict (déconnecté/réassocié à chaque re-render)
  let chartResizeObserver = null;

  function renderAnalyseExpress({ revenusImposables, netReel, caNum, regimeNom, regimeTag, threshold }) {
    const net = Math.max(0, netReel);
    const diff = revenusImposables - net;
    const charges = typeof state.charges === 'number' ? state.charges : 0;
    const chargesPct = caNum > 0 ? (charges / caNum) * 100 : 0;

    const { tone, label, heroLabel, heroValue, heroSub } = getVerdictMeta(diff);
    const iconKey = VERDICT_ICON[tone];
    const eyebrow = 'Résultat';
    const explainHtml = `Vos <strong>charges réelles (hors cotisations sociales)</strong> représentent <strong>${chargesPct.toLocaleString('fr-FR', { minimumFractionDigits: 1, maximumFractionDigits: 1 })} %</strong> du CA.<br> Pour une activité dans la catégorie <strong>${regimeNom}</strong> (${regimeTag}), le régime micro-fiscal est optimal tant que ces charges sont inférieures à <strong>${threshold} %</strong> du CA.<br><br><i style="font-size:11px;">(*) IR : impôt sur le revenu</i>`;

    const card = el('div', { class: 'card' });
    const inner = el('div', { class: 'verdict', dataset: { tone } });

    inner.appendChild(el('div', { class: 'verdict__banner' },
      el('div', { class: 'verdict__banner-icon', 'aria-hidden': 'true' },
        svgIcon(ICONS[iconKey], 22)
      ),
      el('div', { class: 'verdict__banner-text' },
        el('div', { class: 'verdict__banner-eyebrow' }, eyebrow),
        el('div', { class: 'verdict__banner-label' }, label)
      )
    ));

    inner.appendChild(el('div', { class: 'verdict__hero' },
      el('span', { class: 'verdict__hero-label' }, heroLabel),
      el('span', { class: 'verdict__hero-value' }, heroValue),
      el('span', { class: 'verdict__hero-sub' }, heroSub)
    ));

    const CHART_H = 220;
    const LABEL_H = 52;
    const maxValChart = Math.max(revenusImposables, net, 1) * 1.15;
    const hImpos = Math.round(revenusImposables / maxValChart * CHART_H);
    const hNet = Math.round(net / maxValChart * CHART_H);

    const compareWrap = el('div', { class: 'compare' },
      el('div', { class: 'compare__title' }, 'Revenu imposable vs Bénéfice réel')
    );
    const chart = el('div', { class: 'chart', style: { height: (CHART_H + LABEL_H) + 'px' } });
    const refline = el('div', { class: 'chart__refline' });
    chart.appendChild(refline);
    const barAccent = el('div', {
      class: 'chart__bar chart__bar--accent',
      style: { height: hImpos + 'px' }
    });
    const bars = el('div', { class: 'chart__bars', style: { height: '100%' } },
      el('div', { class: 'chart__col' },
        el('span', { class: 'chart__amount chart__amount--accent' }, fmtEUR(revenusImposables)),
        barAccent,
        el('div', { class: 'chart__caption' },
          el('div', { class: 'chart__caption-title chart__caption-title--accent' }, 'Revenu imposable'),
          el('div', { class: 'chart__caption-sub' }, 'base fiscale')
        )
      ),
      el('div', { class: 'chart__col' },
        el('span', { class: 'chart__amount chart__amount--ink' }, fmtEUR(net)),
        el('div', {
          class: 'chart__bar chart__bar--primary',
          style: { height: Math.max(hNet, 4) + 'px' }
        }),
        el('div', { class: 'chart__caption' },
          el('div', { class: 'chart__caption-title' }, 'Bénéfice réel'),
          el('div', { class: 'chart__caption-sub' }, 'avant IR(*)')
        )
      )
    );
    chart.appendChild(bars);
    const baseline = el('div', { class: 'chart__baseline' });
    chart.appendChild(baseline);
    compareWrap.appendChild(chart);
    inner.appendChild(compareWrap);

    function alignChartLines() {
      const chartRect = chart.getBoundingClientRect();
      const barRect = barAccent.getBoundingClientRect();
      if (chartRect.height === 0) return;
      refline.style.bottom = (chartRect.bottom - barRect.top - 1) + 'px';
      baseline.style.bottom = (chartRect.bottom - barRect.bottom) + 'px';
    }
    requestAnimationFrame(alignChartLines);
    if (typeof ResizeObserver !== 'undefined') {
      // Singleton réutilisé entre renders pour éviter l'accumulation d'observers orphelins
      if (chartResizeObserver) chartResizeObserver.disconnect();
      chartResizeObserver = new ResizeObserver(alignChartLines);
      chartResizeObserver.observe(chart);
    }

    inner.appendChild(el('div', { class: 'verdict__explain', html: explainHtml }));

    card.appendChild(inner);
    return card;
  }

  const STEP_RENDERERS = [
    renderStep0, renderStep1, renderStep2, renderStep3, renderStep4, renderStep5
  ];

  // Trace le step réellement affiché à l'écran (indépendant de state.prevStep
  // qui n'est pas synchronisé sur tous les setState).
  let __lastRenderedStep = null;

  function render() {
    const app = document.getElementById('app');

    const stepChanged = __lastRenderedStep !== state.step && __lastRenderedStep !== null;
    const sameStep = __lastRenderedStep === state.step;

    // Construire le nouveau DOM hors-écran dans un fragment.
    // Ainsi, l'utilisateur ne voit jamais de page vide entre l'ancien et le nouveau contenu,
    // et la position de scroll est naturellement préservée.
    const fragment = document.createDocumentFragment();
    const container = el('div', { class: 'container' });
    container.appendChild(renderHeader());

    if (state.step >= 1 && state.step <= 4) {
      container.appendChild(StepIndicator(state.step, 4));
    }

    const stepContent = STEP_RENDERERS[state.step]();
    // Si on reste dans la même étape (ex: sélection régime, mise à jour interne),
    // on désactive l'animation d'entrée pour éviter un effet visuel indésirable.
    if (sameStep) {
      stepContent.classList.remove('step-enter');
    }
    container.appendChild(stepContent);

    fragment.appendChild(container);
    fragment.appendChild(renderFooter());

    // Swap atomique : on remplace tout d'un coup, sans passer par un état "page vide".
    app.replaceChildren(fragment);

    // Sur vrai changement d'étape, on remonte en haut.
    // Sur re-render dans la même étape, on ne fait rien : le scroll reste où il était.
    if (stepChanged) {
      window.scrollTo(0, 0);
    }

    __lastRenderedStep = state.step;

    // Focus management : sur changement d'étape, ramener le focus en haut du contenu (a11y)
    const heading = container.querySelector('h2, h1');
    if (heading && state.prevStep !== null && state.prevStep !== state.step) {
      heading.setAttribute('tabindex', '-1');
      requestAnimationFrame(() => heading.focus({ preventScroll: true }));
    }
  }

  // Démarrage
  render();
  </script>
</body>
</html>
